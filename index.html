<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator - Nitish Kumar Yadav</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #1a1936;
      padding: 20px;
    }

    .calculator {
      background: #25244a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 36px;
      padding: 30px 24px 24px 24px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
      width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Header Section */
    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      color: #ffffff;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .header .author-title {
      color: #e5935c;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Display Screen */
    .display {
      width: 100%;
      margin-bottom: 24px;
    }

    .display input {
      width: 100%;
      height: 90px;
      outline: none;
      border: none;
      background: #1d1c3a;
      border-radius: 20px;
      color: #ffffff;
      font-size: 3rem;
      font-weight: 400;
      text-align: right;
      padding: 0 24px;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    /* Buttons Grid */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      width: 100%;
    }

    input[type="button"] {
      height: 64px;
      border: none;
      outline: none;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: #ffffff;
      font-size: 1.35rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    input[type="button"]:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }

    input[type="button"]:active {
      transform: translateY(1px);
    }

    /* Primary Accent Buttons */
    .btn-ac {
      background: linear-gradient(135deg, #ff7b6b 0%, #ff5252 100%) !important;
      color: #ffffff !important;
      box-shadow: 0 6px 18px rgba(255, 90, 90, 0.35);
    }

    .btn-purple {
      background: linear-gradient(135deg, #8f6cf7 0%, #7b52f5 100%) !important;
      color: #ffffff !important;
      box-shadow: 0 6px 18px rgba(130, 90, 245, 0.35);
    }

    .btn-equal {
      background: linear-gradient(135deg, #ff9e59 0%, #ff7b3d 100%) !important;
      color: #ffffff !important;
      box-shadow: 0 6px 18px rgba(255, 135, 60, 0.4);
    }

    /* Footer Branding */
    .footer-credit {
      margin-top: 24px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.8rem;
      font-weight: 400;
    }

    .footer-credit strong {
      color: #ffffff;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="calculator">
    <!-- Header with Name -->
    <div class="header">
      <h1>Calculator</h1>
      <div class="author-title">NITISH KUMAR YADAV</div>
    </div>

    <!-- Display -->
    <form name="calcForm" style="width: 100%;" onsubmit="return false;">
      <div class="display">
        <input type="text" id="display" placeholder="0" readonly>
      </div>

      <!-- Keypad -->
      <div class="buttons">
        <input type="button" value="AC" class="btn-ac" onclick="clearDisplay()">
        <input type="button" value="DE" class="btn-purple" onclick="deleteChar()">
        <input type="button" value="%" class="btn-purple" onclick="appendValue('%')">
        <input type="button" value="÷" class="btn-purple" onclick="appendValue('/')">

        <input type="button" value="7" onclick="appendValue('7')">
        <input type="button" value="8" onclick="appendValue('8')">
        <input type="button" value="9" onclick="appendValue('9')">
        <input type="button" value="×" class="btn-purple" onclick="appendValue('*')">

        <input type="button" value="4" onclick="appendValue('4')">
        <input type="button" value="5" onclick="appendValue('5')">
        <input type="button" value="6" onclick="appendValue('6')">
        <input type="button" value="−" class="btn-purple" onclick="appendValue('-')">

        <input type="button" value="1" onclick="appendValue('1')">
        <input type="button" value="2" onclick="appendValue('2')">
        <input type="button" value="3" onclick="appendValue('3')">
        <input type="button" value="+" class="btn-purple" onclick="appendValue('+')">

        <input type="button" value="00" onclick="appendValue('00')">
        <input type="button" value="0" onclick="appendValue('0')">
        <input type="button" value="." onclick="appendValue('.')">
        <input type="button" value="=" class="btn-equal" onclick="calculate()">
      </div>
    </form>

    <!-- Footer Credit -->
    <div class="footer-credit">
      Designed & built by <strong>Nitish Kumar Yadav</strong>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function appendValue(val) {
      if (display.value === '0' && val !== '.') {
        display.value = val;
      } else {
        display.value += val;
      }
    }

    function clearDisplay() {
      display.value = '';
    }

    function deleteChar() {
      display.value = display.value.toString().slice(0, -1);
    }

    function calculate() {
      if (!display.value) return;
      try {
        let expression = display.value.replace(/%/g, '/100');
        display.value = Function('"use strict";return (' + expression + ')')();
      } catch (e) {
        display.value = 'Error';
        setTimeout(clearDisplay, 1500);
      }
    }

    // Keyboard controls
    document.addEventListener('keydown', (event) => {
      const key = event.key;
      if (!isNaN(key) || ['+', '-', '*', '/', '.', '%'].includes(key)) {
        appendValue(key);
      } else if (key === 'Enter' || key === '=') {
        calculate();
      } else if (key === 'Backspace') {
        deleteChar();
      } else if (key === 'Escape') {
        clearDisplay();
      }
    });
  </script>
</body>
</html>
